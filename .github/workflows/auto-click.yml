
name: Molab Notebook Automation

on:
  workflow_dispatch:

jobs:
  molab:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore session
        shell: bash
        env:
          AUTH_STATE: ${{ secrets.AUTH_STATE_BASE64 }}
        run: |
          echo "$AUTH_STATE" | base64 --decode > auth.json
          test -s auth.json

      - name: Run Molab automation
        run: node click.js

      - name: Remove session file
        if: always()
        run: rm -f auth.json
