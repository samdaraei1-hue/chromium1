
name: Molab Notebook Automation

on:
  workflow_dispatch:

jobs:
  molab:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore session
        shell: bash
        env:
          AUTH_STATE: ${{ secrets.AUTH_STATE_BASE64 }}
        run: |
          echo "$AUTH_STATE" | base64 --decode > auth.json
          test -s auth.json

      - name: Capture browser preview
        run: xvfb-run -a node click.js --visual-review

      - name: Upload browser preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: molab-browser-preview
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 1

      - name: Run Molab automation
        run: xvfb-run -a node click.js

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: molab-run-logs-and-screenshots
          path: artifacts/*
          if-no-files-found: ignore
          retention-days: 1

      - name: Remove session file
        if: always()
        run: rm -f auth.json
