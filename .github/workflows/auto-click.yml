
name: Molab Notebook Automation

on:
  workflow_dispatch:

jobs:
  molab:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore session
        shell: bash
        env:
          AUTH_STATE: ${{ secrets.AUTH_STATE_BASE64 }}
        run: |
          echo "$AUTH_STATE" | base64 --decode > auth.json
          test -s auth.json

      - name: Run Molab automation with one in-browser recovery
        shell: bash
        run: |
          mkdir -p artifacts
          run_log="${RUNNER_TEMP}/molab-run.log"
          if xvfb-run -a node click.js > "$run_log" 2>&1; then
            status=0
          else
            status=$?
          fi
          if [ "$status" -ne 0 ]; then
            echo "Automation stopped. Relevant Molab or browser errors:"
            grep -Ei 'error|failed|exception|timeout|HTTP [45][0-9][0-9]|request failed' "$run_log" | tail -n 80 | tee -a artifacts/automation-diagnostics.log || true
            exit "$status"
          fi
          echo "Automation completed successfully."
          grep -Ei 'error|failed|exception|timeout|HTTP [45][0-9][0-9]|request failed' "$run_log" | tail -n 80 >> artifacts/automation-diagnostics.log || true

      - name: Upload filtered diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: molab-error-diagnostics
          path: |
            artifacts/automation-diagnostics.log
            artifacts/notebook-logs.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Remove session file
        if: always()
        run: rm -f auth.json
